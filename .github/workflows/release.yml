name: Release

# Push a tag like v0.2.0 after setting the same version in
# homedrive/config.yaml. Home Assistant pulls the image tag that matches the
# add-on version.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check add-on version matches the tag
        run: |
          want="${GITHUB_REF_NAME#v}"
          have="$(sed -nE 's/^version: *"?([^"]+)"?$/\1/p' homedrive/config.yaml)"
          if [ "$want" != "$have" ]; then
            echo "homedrive/config.yaml has version $have, tag is $want"
            exit 1
          fi
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/homedrive" >> "$GITHUB_ENV"
          echo "VERSION=$want" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ env.VERSION }}
          provenance: mode=max
          sbom: true
